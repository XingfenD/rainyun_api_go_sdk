name: Monitor OpenAPI Spec

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream spec
        run: curl -fsSL https://api.rainyun.com/openapi.json -o /tmp/live_openapi.json

      - name: Diff upstream vs tracked domains
        id: diff
        run: |
          python3 docs/scripts/filter_openapi.py docs/openapi.json "domain,public,rbm,rcs,rgs,ros,ssl" /tmp/repo_upstream.json
          if python3 docs/scripts/diff_openapi.py /tmp/repo_upstream.json /tmp/live_openapi.json /tmp/summary.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update docs/openapi.json
        if: steps.diff.outputs.changed == 'true'
        run: |
          python3 docs/scripts/filter_openapi.py docs/openapi.json "rcdn,rca,rvh" /tmp/repo_extra.json
          python3 docs/scripts/merge_openapi.py /tmp/live_openapi.json /tmp/repo_extra.json docs/openapi.json
          python3 docs/scripts/generate.py

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(docs): sync openapi.json with upstream"
          branch: chore/sync-openapi-spec
          delete-branch: true
          title: "chore(docs): update openapi.json from api.rainyun.com"
          body-path: /tmp/summary.md
          labels: docs
          add-paths: docs/openapi.json docs/openapi/ docs/PROGRESS.md
