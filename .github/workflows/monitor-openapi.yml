name: Monitor OpenAPI Spec

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream spec
        run: curl -fsSL https://api.rainyun.com/openapi.json -o /tmp/live_openapi.json

      - name: Diff upstream vs docs/openapi.json
        id: diff
        run: |
          if python3 docs/scripts/diff_openapi.py docs/openapi.json /tmp/live_openapi.json /tmp/summary.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update docs/openapi.json
        if: steps.diff.outputs.changed == 'true'
        run: |
          python3 - <<'PY'
          import json
          live = json.load(open("/tmp/live_openapi.json", encoding="utf-8"))
          with open("docs/openapi.json", "w", encoding="utf-8") as f:
              json.dump(live, f, ensure_ascii=False, indent=4)
          PY

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(docs): sync openapi.json with upstream"
          branch: chore/sync-openapi-spec
          delete-branch: true
          title: "chore(docs): update openapi.json from api.rainyun.com"
          body-path: /tmp/summary.md
          labels: docs
          add-paths: docs/openapi.json
